name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/magic-mcp-apple-design-awmyad]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -- --base=/craigapp/
      # SPA fallback so deep links like /craigapp/app resolve to the router
      - run: cp dist/index.html dist/404.html
      # Publishing to a gh-pages branch auto-enables Pages on public repos
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
